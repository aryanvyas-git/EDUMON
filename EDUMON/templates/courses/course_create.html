{% extends 'base.html' %}
{% load design %}
{% block title %}New Course{% endblock %}
{% block page_title %}New Course{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="field">
                <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="field__error">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">{% icon 'plus-circle' size=16 %}Create</button>
    </form>
</div>
{% endblock %}
